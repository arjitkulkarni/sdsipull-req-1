[project]
name = "meeting-to-action-agent"
version = "1.0.0"
description = "Meeting transcript -> verified decisions, owned action items and a follow-up draft; flags instead of guessing."
requires-python = ">=3.10"
dependencies = ["anthropic>=1.13", "pydantic>=2.7"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115"]

[project.scripts]
meeting-agent = "meeting_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
